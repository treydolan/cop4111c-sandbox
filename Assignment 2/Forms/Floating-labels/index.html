<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.css' integrity='sha512-zylce7fP6h4usg536JBTRj2rt7q22Z0qicHSlgSK53Irtfkz37ate3KCQ59du+aXZV6R3yyL2X1LyGKBEUMZaw==' crossorigin='anonymous'/>
    <script src='https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/js/bootstrap.js' integrity='sha512-GKxQGmCBqm3YHCZTdqD3Bvsz+AHRObqztq6xDo+68527RxgVw7wF1TR5ZSBvtWiz5qzpOzUGGvxJbT/6UzzSOQ==' crossorigin='anonymous'></script>
    <title>Floating Labels</title>
</head>
<body>
    <header>
        <h1 class="container mt-4">Floating Labels</h1>
    </header>
    <main>
        <section>
            <h2>Floating Labels</h2>
            <p><code>form-floating</code></p>
            <h3>Example:</h3>
            <h1>Range</h1>

            <h4 class="text-secondary">Input Fields</h4>
            <div class="form-floating">
            <input type="name" class="form-control" id="humanName" aria-describedby="nameHelp" placeholder="Name">
            <label for="humanName">Name</label>
            </div>

            <hr>

            <h4 class="text-secondary">Select</h4>

            <div class="form-floating">
            <select class="form-select" id="camperType" aria-label="Floating label select example">
            <option selected>Choose...</option>
            <option value="Trailer">A vintage travel trailer</option>
            <option value="Class A">A Class-A bus or motorhome</option>
            <option value="Ten">A self-building tent</option>
            </select>
            <label for="camperType">What kind of camper do you plan to bring?</label>  
            </div>

            <hr>
        </section>
    </main>
</body>
</html>
