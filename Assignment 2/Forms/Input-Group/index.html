<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.css' integrity='sha512-zylce7fP6h4usg536JBTRj2rt7q22Z0qicHSlgSK53Irtfkz37ate3KCQ59du+aXZV6R3yyL2X1LyGKBEUMZaw==' crossorigin='anonymous'/>
    <script src='https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/js/bootstrap.js' integrity='sha512-GKxQGmCBqm3YHCZTdqD3Bvsz+AHRObqztq6xDo+68527RxgVw7wF1TR5ZSBvtWiz5qzpOzUGGvxJbT/6UzzSOQ==' crossorigin='anonymous'></script>
    <title>Input Group</title>
</head>
<body>
    <header>
        <h1 class="container mt-4">Input Group</h1>
    </header>
    <main>
        <section>
            <h2>Input Group Classes</h2>
            <p><code>input-group{SIZ}</code></p>
            <small>SIZ:</small>
            <ul>
                <li><code>sm</code></li>
                <li><code>lg</code></li>
            </ul>
            <p><code>input-group-text</code></p>
            <h3>Example:</h3>
            <h1>Input Groups</h1>

            <h4 class="text-secondary">Input Groups</h4>

            <div class="input-group mb-3">
            <span class="input-group-text bg-success text-white" id="basic-addon1">Camper Type</span>
            <input type="text" class="form-control" placeholder="Username" aria-label="Username" aria-describedby="basic-addon1">
            </div>

            <hr>

            <h4 class="text-secondary">Input Group Small</h4>

            <div class="input-group input-group-sm mb-3">
            <div class="input-group-text">
                <input class="form-check-input mt-0" type="checkbox" value="" aria-label="Checkbox for following text input">
            </div>
            <input type="text" class="form-control" placeholder="Username" aria-label="Username" aria-describedby="basic-addon1">
            </div>

            <hr>

            <h4 class="text-secondary">Input Group Large</h4>
            <div class="input-group input-group-lg mb-3">
            <input type="text" class="form-control" placeholder="Username" aria-label="Username" aria-describedby="basic-addon1">
            <button class="btn btn-primary" type="button" id="button-addon2">Button</button>
            </div>
        </section>
    </main>
</body>
</html>
