<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.css' integrity='sha512-zylce7fP6h4usg536JBTRj2rt7q22Z0qicHSlgSK53Irtfkz37ate3KCQ59du+aXZV6R3yyL2X1LyGKBEUMZaw==' crossorigin='anonymous'/>
    <script src='https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/js/bootstrap.js' integrity='sha512-GKxQGmCBqm3YHCZTdqD3Bvsz+AHRObqztq6xDo+68527RxgVw7wF1TR5ZSBvtWiz5qzpOzUGGvxJbT/6UzzSOQ==' crossorigin='anonymous'></script>
    <title>Spinner</title>
</head>
<body>
    <header>
        <h1 class="container mt-4">Spinner</h1>
    </header>
    <main>
        <section>
            <h2>Spinner Classes</h2>
            <p><code>spinner-border</code></p>
            <p><code>spinner-grow</code></p>
            <h3>Example:</h3>
            <h1>Progress Bar</h1>

            <h4 class="text-secondary">Basic</h4>

            <div class="spinner-border text-info">
            <span class="visually-hidden">Loading...</span>
            </div>

            <hr>

            <h4 class="text-secondary">Growing Spinners</h4>
            <div class="d-flex justify-content-center">
            <div class="spinner-grow text-danger d-flex justify-content-center align-items-center"
                    role="status">
                <i class="bi bi-heart-fill text-warning"></i>
                <span class="visually-hidden">Loading...</span>
            </div>
            </div>
            <hr>
        </section>
    </main>
</body>
</html>
