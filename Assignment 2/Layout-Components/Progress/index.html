<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.css' integrity='sha512-zylce7fP6h4usg536JBTRj2rt7q22Z0qicHSlgSK53Irtfkz37ate3KCQ59du+aXZV6R3yyL2X1LyGKBEUMZaw==' crossorigin='anonymous'/>
    <script src='https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/js/bootstrap.js' integrity='sha512-GKxQGmCBqm3YHCZTdqD3Bvsz+AHRObqztq6xDo+68527RxgVw7wF1TR5ZSBvtWiz5qzpOzUGGvxJbT/6UzzSOQ==' crossorigin='anonymous'></script>
    <title>Progress</title>
</head>
<body>
    <header>
        <h1 class="container mt-4">Progress</h1>
    </header>
    <main>
    <section>
        <h2>Progress Bar Classes</h2>
        <p><code>progress</code></p>
        <p><code>progress-bar{-TYP}</code></p>
        <ul>
            <li><code>striped</code></li>
            <li><code>animated</code></li>
        </ul>
        <h3>Example:</h3>
        <h1>Progress Bar</h1>

        <h4 class="text-secondary">Basic</h4>

        <div class="progress">
        <div class="progress-bar w-25 bg-success"
            role="progressbar"
            aria-valuenow="25"
            aria-valuemin="0"
            aria-valuemax="100">Dolores</div> 
        </div>

        <hr>

        <h4 class="text-secondary">Multiple Progress Bars</h4>

        <div class="progress" style="height:40px;">
        <div class="progress-bar w-25 bg-danger"
            role="progressbar"
            aria-valuenow="25"
            aria-valuemin="0"
            aria-valuemax="100">Dolores</div> 
        <div class="progress-bar w-25 bg-success"
            role="progressbar"
            aria-valuenow="25"
            aria-valuemin="0"
            aria-valuemax="100">Bubbles</div> 
        <div class="progress-bar w-25 bg-primary"
            role="progressbar"
            aria-valuenow="25"
            aria-valuemin="0"
            aria-valuemax="100">Bubbles</div> 
        </div>

        <hr>

        <hr>

        <h4 class="text-secondary">Striped Progress Bar</h4>

        <div class="progress" style="height:40px;">
        <div class="progress-bar progress-bar-striped w-75 bg-warning text-dark"
            role="progressbar"
            aria-valuenow="25"
            aria-valuemin="0"
            aria-valuemax="100">Dolores</div> 
        </div>

        <hr>

        <h4 class="text-secondary">Animated Progress Bar</h4>

        <div class="progress" style="height:40px;">
        <div class="progress-bar progress-bar-striped progress-bar-animated bg-danger"
            style="width:90%;"
            role="progressbar"
            aria-valuenow="90"
            aria-valuemin="0"
            aria-valuemax="100">Dolores</div> 
        </div>

        <hr>
    </section>
    </main>
</body>
</html>
