<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <script src='https://cdnjs.cloudflare.com/ajax/libs/riot/10.0.1/riot.min.js' integrity='sha512-XCvbSyPZDuJC/hyxmjBk8VjzbvQr0EegqW3MkvEDVCb0veBQzlWmKPdFffp9cRQ7wJljZNinAY32w3z+P5TvQA==' crossorigin='anonymous'></script> -->
    <link rel="stylesheet" href="todo.css">
    <title>Riot.js</title>
</head>
<body>
    <todo></todo>

    <script src="todo.riot" type="riot"></script>
    <script src="https://unpkg.com/riot@10/riot+compiler.min.js"></script>

    <script>
      riot.compile().then(() => {
        riot.mount('todo', {
          title: 'I want to behave!',
          items: [
            { title: 'Avoid excessive caffeine', done: true },
            { title: 'Be less provocative' },
            { title: 'Be nice to people' },
          ],
        })
      })
    </script>
</body>
</html>
