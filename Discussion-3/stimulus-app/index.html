<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script type="module" src="main.js"></script>
    <title>Stimulus</title>
</head>
<body>
   <main class="card" data-controller="todo">
    <h1>Productivity Dashboard</h1>

    <form data-action="submit->todo#add">
      <label for="task" class="sr-only">New task</label>
      <input id="task" type="text" required placeholder="Add a task…"
             data-todo-target="input" />
      <button type="submit">Add</button>
      <button type="button" data-action="todo#clearDone">Clear done</button>
    </form>

    <div class="row">
      <span class="pill" data-todo-target="total"></span>
      <span class="pill" data-todo-target="remaining"></span>

      <label for="filter" style="margin-left:auto;">Filter</label>
      <select id="filter" data-action="change->todo#filter" data-todo-target="filter">
        <option value="all">All</option>
        <option value="active">Active</option>
        <option value="done">Done</option>
      </select>
    </div>

    <ul aria-label="Task list" data-todo-target="list"></ul>
  </main> 
</body>
</html>
